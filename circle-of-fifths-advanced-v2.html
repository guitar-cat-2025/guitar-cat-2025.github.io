<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Circle of Fifths Advanced | Guitar Tools</title>
<style>
:root{--bg:#070a0f;--panel:#10151d;--line:#2b3442;--txt:#f4f7fb;--muted:#8f9bad;--a:#75d8ff;--maj:#172633;--min:#1b1c2c;--ch:#17201d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#172130 0,#090c12 45%,#06080c 100%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}
header{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:auto}.brand{font-weight:850;letter-spacing:.08em;font-size:14px}.brand span{color:var(--muted);font-weight:600}.pill{border:1px solid var(--line);background:#111720;color:#b7c0ce;border-radius:999px;padding:7px 10px;font:inherit;font-size:11px}
main{max-width:820px;margin:auto;padding:0 10px 30px}.title{text-align:center;margin:2px 0 8px}.title h1{font-size:clamp(23px,5vw,34px);margin:0}.title p{font-size:11px;color:var(--muted);margin:4px 0}
.stage{position:relative;width:min(96vw,720px);aspect-ratio:1;margin:auto}.ring{position:absolute;inset:0;border-radius:50%}.guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #27303d;border-radius:50%;pointer-events:none}.g1{width:94%;height:94%}.g2{width:72%;height:72%}.g3{width:49%;height:49%}
.key,.minor,.dia{position:absolute;transform:translate(-50%,-50%);border:1px solid #344052;color:var(--txt);display:grid;place-items:center;text-align:center;cursor:pointer;transition:.14s;font-weight:800}
.key{width:clamp(46px,10vw,68px);height:clamp(46px,10vw,68px);border-radius:50%;background:var(--maj);font-size:clamp(14px,3.5vw,21px);z-index:4}.minor{width:clamp(39px,8.5vw,56px);height:clamp(39px,8.5vw,56px);border-radius:50%;background:var(--min);font-size:clamp(10px,2.8vw,15px);z-index:4;color:#c6c8e6}.key.active{border:2px solid var(--a);box-shadow:0 0 22px #75d8ff55;background:#203848}.minor.related{border-color:#9e8cff;box-shadow:0 0 15px #9e8cff44}.key.neighbor{border-color:#547a8d}
.dia{width:clamp(45px,9.5vw,62px);height:clamp(35px,7.5vw,48px);border-radius:12px;background:var(--ch);font-size:clamp(10px,2.6vw,14px);z-index:5}.dia strong{display:block}.dia small{font-size:8px;color:var(--muted)}.dia.primary{border-color:#4e9ab8}.dia.active{border:2px solid var(--a);background:#20352f;box-shadow:0 0 15px #75d8ff35}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:31%;aspect-ratio:1;border-radius:50%;background:#0b1017;border:1px solid #313b49;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;box-shadow:inset 0 0 30px #0008}.center .k{font-size:clamp(25px,7vw,48px);font-weight:900;line-height:1}.center .deg{font-size:clamp(9px,2.3vw,12px);color:var(--a);margin-top:5px}.tones{font-size:clamp(10px,2.5vw,14px);margin-top:5px}.tones b{color:#dff7ff}
.bar{max-width:680px;margin:4px auto 0;border:1px solid var(--line);background:#0d1219;border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.bar b{color:#e9edf4}.legend{display:flex;gap:10px;flex-wrap:wrap}.dot:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:#4e9ab8}.dot:nth-child(2):before{background:#9e8cff}.dot:nth-child(3):before{background:#637081}
.sheet{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:20}.sheet.show{display:grid}.box{max-width:520px;background:#111720;border:1px solid #303a49;border-radius:20px;padding:20px;line-height:1.7}.box h3{margin:0 0 8px}.box p{font-size:13px;color:#bdc6d4}.close{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:#1a2230;color:white}
@media(max-width:520px){header{height:50px}.stage{width:100%;}.bar{margin-top:0}.title{margin-bottom:0}}
.key[data-i="0"]{left:50.000%;top:4.000%}
.minor[data-i="0"]{left:50.000%;top:15.000%}
.key[data-i="1"]{left:73.000%;top:10.163%}
.minor[data-i="1"]{left:67.500%;top:19.689%}
.key[data-i="2"]{left:89.837%;top:27.000%}
.minor[data-i="2"]{left:80.311%;top:32.500%}
.key[data-i="3"]{left:96.000%;top:50.000%}
.minor[data-i="3"]{left:85.000%;top:50.000%}
.key[data-i="4"]{left:89.837%;top:73.000%}
.minor[data-i="4"]{left:80.311%;top:67.500%}
.key[data-i="5"]{left:73.000%;top:89.837%}
.minor[data-i="5"]{left:67.500%;top:80.311%}
.key[data-i="6"]{left:50.000%;top:96.000%}
.minor[data-i="6"]{left:50.000%;top:85.000%}
.key[data-i="7"]{left:27.000%;top:89.837%}
.minor[data-i="7"]{left:32.500%;top:80.311%}
.key[data-i="8"]{left:10.163%;top:73.000%}
.minor[data-i="8"]{left:19.689%;top:67.500%}
.key[data-i="9"]{left:4.000%;top:50.000%}
.minor[data-i="9"]{left:15.000%;top:50.000%}
.key[data-i="10"]{left:10.163%;top:27.000%}
.minor[data-i="10"]{left:19.689%;top:32.500%}
.key[data-i="11"]{left:27.000%;top:10.163%}
.minor[data-i="11"]{left:32.500%;top:19.689%}
.dia[data-i="0"]{left:50.000%;top:25.500%}
.dia[data-i="1"]{left:69.155%;top:34.724%}
.dia[data-i="2"]{left:73.886%;top:55.452%}
.dia[data-i="3"]{left:60.630%;top:72.074%}
.dia[data-i="4"]{left:39.370%;top:72.074%}

</style></head><body>
<header><div class="brand">GUITAR TOOLS <span>/ ADVANCED</span></div><button class="pill" id="info">表示の見方</button></header>
<main><div class="title"><h1>Circle of Fifths</h1><p>五度圏 — キー・相対マイナー・ダイアトニックコードを1画面で</p></div>
<div class="stage" id="stage"><div class="guide g1"></div><div class="guide g2"></div><div class="guide g3"></div><div class="ring" id="majorRing"><button class="key active" data-i="0">C</button><button class="key" data-i="1">G</button><button class="key" data-i="2">D</button><button class="key" data-i="3">A</button><button class="key" data-i="4">E</button><button class="key" data-i="5">B</button><button class="key" data-i="6">F♯</button><button class="key" data-i="7">D♭</button><button class="key" data-i="8">A♭</button><button class="key" data-i="9">E♭</button><button class="key" data-i="10">B♭</button><button class="key" data-i="11">F</button></div><div class="ring" id="minorRing"><button class="minor related" data-i="0">Am</button><button class="minor" data-i="1">Em</button><button class="minor" data-i="2">Bm</button><button class="minor" data-i="3">F♯m</button><button class="minor" data-i="4">C♯m</button><button class="minor" data-i="5">G♯m</button><button class="minor" data-i="6">D♯m</button><button class="minor" data-i="7">B♭m</button><button class="minor" data-i="8">Fm</button><button class="minor" data-i="9">Cm</button><button class="minor" data-i="10">Gm</button><button class="minor" data-i="11">Dm</button></div><div class="ring" id="diaRing"><button class="dia primary active" data-i="0"><strong>C</strong><small>I</small></button><button class="dia" data-i="1"><strong>Dm</strong><small>ii</small></button><button class="dia" data-i="2"><strong>Em</strong><small>iii</small></button><button class="dia primary" data-i="3"><strong>F</strong><small>IV</small></button><button class="dia primary" data-i="4"><strong>G</strong><small>V</small></button><button class="dia" data-i="5"><strong>Am</strong><small>vi</small></button><button class="dia" data-i="6"><strong>Bdim</strong><small>vii°</small></button></div>
<div class="center"><div class="k" id="ck">C</div><div class="deg" id="cd">I · Major</div><div class="tones" id="tones"><b>C</b> · E · G</div></div></div>
<div class="bar"><div id="summary"><b>C Major</b>　♯/♭ なし　Relative: Am</div><div class="legend"><span class="dot">I・IV・V</span><span class="dot">Relative</span><span class="dot">Neighbor</span></div></div>
</main>
<div class="sheet" id="sheet"><div class="box"><h3>表示の見方</h3><p><b>外周</b>：12のメジャーキー<br><b>中周</b>：各キーの相対マイナー<br><b>内周</b>：選択中のキーで使う7つのダイアトニックコード<br><b>中央</b>：選択中コードの度数・種類・構成音<br><br>外周では選択キーの左右も薄く強調します。五度圏上で隣り合うキーは共通音が多い近親調です。</p><button class="close" id="close">閉じる</button></div></div>
<script>
const K=[
["C","Am","♯/♭ なし",["C","D","E","F","G","A","B"]],
["G","Em","♯1",["G","A","B","C","D","E","F♯"]],
["D","Bm","♯2",["D","E","F♯","G","A","B","C♯"]],
["A","F♯m","♯3",["A","B","C♯","D","E","F♯","G♯"]],
["E","C♯m","♯4",["E","F♯","G♯","A","B","C♯","D♯"]],
["B","G♯m","♯5",["B","C♯","D♯","E","F♯","G♯","A♯"]],
["F♯","D♯m","♯6",["F♯","G♯","A♯","B","C♯","D♯","E♯"]],
["D♭","B♭m","♭5",["D♭","E♭","F","G♭","A♭","B♭","C"]],
["A♭","Fm","♭4",["A♭","B♭","C","D♭","E♭","F","G"]],
["E♭","Cm","♭3",["E♭","F","G","A♭","B♭","C","D"]],
["B♭","Gm","♭2",["B♭","C","D","E♭","F","G","A"]],
["F","Dm","♭1",["F","G","A","B♭","C","D","E"]]];
const DEG=["I","ii","iii","IV","V","vi","vii°"],Q=["Major","minor","minor","Major","Major","minor","dim"];
let sel=0,ch=0;
const pos=(i,r)=>{let a=(i*30-90)*Math.PI/180;return [50+r*Math.cos(a),50+r*Math.sin(a)]};
function chord(i){let root=K[sel][3][i];return i==6?root+"dim":[1,2,5].includes(i)?root+"m":root}
function tones(i){let s=K[sel][3];return [s[i],s[(i+2)%7],s[(i+4)%7]]}
function build(){
 document.querySelectorAll(".key").forEach((b,i)=>{
   b.className="key"+(i===sel?" active":"")+(((i-sel+12)%12===1||(sel-i+12)%12===1)?" neighbor":"");
   b.onclick=()=>{sel=i;ch=0;render()};
 });
 document.querySelectorAll(".minor").forEach((b,i)=>{
   b.className="minor"+(i===sel?" related":"");
   b.onclick=()=>{sel=i;ch=5;render()};
 });
 document.querySelectorAll(".dia").forEach((b,i)=>{
   b.className="dia"+([0,3,4].includes(i)?" primary":"")+(i===ch?" active":"");
   b.innerHTML="<strong>"+chord(i)+"</strong><small>"+DEG[i]+"</small>";
   b.onclick=()=>{ch=i;render()};
 });
}
function render(){build();let ts=tones(ch);document.getElementById("ck").textContent=chord(ch);document.getElementById("cd").textContent=DEG[ch]+" · "+Q[ch];document.getElementById("tones").innerHTML="<b>"+ts[0]+"</b> · "+ts[1]+" · "+ts[2];document.getElementById("summary").innerHTML="<b>"+K[sel][0]+" Major</b>　"+K[sel][2]+"　Relative: "+K[sel][1]}
render();
const sh=document.getElementById("sheet");document.getElementById("info").onclick=()=>sh.classList.add("show");document.getElementById("close").onclick=()=>sh.classList.remove("show");sh.onclick=e=>{if(e.target==sh)sh.classList.remove("show")}
</script></body></html>
