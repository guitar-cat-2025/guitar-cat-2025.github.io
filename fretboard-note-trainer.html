<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ギター指板 音名トレーニング</title>
<style>
*{box-sizing:border-box}:root{--bg:#101114;--panel:#1b1d22;--muted:#969ba2;--ok:#58d47b;--ng:#ff5c5c}
body{margin:0;background:var(--bg);color:#f5f5f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:900px;margin:auto;padding:8px 5px 22px}h1{font-size:19px;text-align:center;margin:3px 0 5px}.sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:9px}.panel{background:var(--panel);padding:8px;border-radius:11px;margin-bottom:8px}.notes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.mode-row{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;margin-top:6px}.mode-btn{padding:9px 5px;font-size:12px}.chaos-btn{font-size:10px;padding:7px 7px;opacity:.9}.mode-btn.active{background:#eee;color:#111;border-color:#fff}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;appearance:none;min-width:0;border:1px solid #474b53;background:#292d34;color:#fff;border-radius:8px;padding:9px 2px;font-size:13px;font-weight:800}.note-btn.active{background:#eee;color:#111;border-color:#fff}.question{text-align:center;font-size:16px;font-weight:850;margin:10px 0 4px}.question b{color:#ffd84d;font-size:24px}.status{text-align:center;height:19px;color:#aeb4ba;font-size:11px;font-weight:700;margin-bottom:4px}.status.complete{color:var(--ok)}
.fretwrap{width:100%;margin-top:10px}
.board{height:155px;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));border-top:1px solid #596068;border-bottom:1px solid #596068}.fretcol{position:relative;background:linear-gradient(#252c32,#1c2227);border-right:2px solid #8e959b}.fretcol.open{background:#171b1f;border-right:4px solid #dce0e3}.fretcol:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#aeb4ba 0,#aeb4ba 1px,transparent 1px,transparent calc(20% - .7px),#aeb4ba calc(20% - .7px),#aeb4ba calc(20% + .7px),transparent calc(20% + .7px),transparent calc(40% - .7px),#aeb4ba calc(40% - .7px),#aeb4ba calc(40% + .7px),transparent calc(40% + .7px),transparent calc(60% - .7px),#aeb4ba calc(60% - .7px),#aeb4ba calc(60% + .7px),transparent calc(60% + .7px),transparent calc(80% - .7px),#aeb4ba calc(80% - .7px),#aeb4ba calc(80% + .7px),transparent calc(80% + .7px),transparent calc(100% - 1px),#aeb4ba calc(100% - 1px),#aeb4ba 100%)}
.hit{position:absolute;left:50%;width:31px;height:31px;transform:translate3d(-50%,-50%,0);z-index:4;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}.hit.s1{top:0}.hit.s2{top:20%}.hit.s3{top:40%}.hit.s4{top:60%}.hit.s5{top:80%}.hit.s6{top:100%}.hit span{display:none;width:27px;height:27px;border-radius:50%;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 5px #000}.hit.correct span,.hit.wrong span{display:flex}.hit.correct span{background:var(--ok)}.hit.wrong span{background:var(--ng)}
.posmark{position:absolute;left:50%;top:77.5px;transform:translate(-50%,-50%);z-index:1;display:flex;gap:3px;pointer-events:none}.posmark i{width:8px;height:8px;border-radius:50%;background:#777e84;opacity:.75}.posmark.two{top:0;left:0;transform:none;width:100%;height:155px;display:block}.posmark.two i{position:absolute;left:50%;transform:translate(-50%,-50%)}.posmark.two i:first-child{top:46.5px}.posmark.two i:last-child{top:108.5px}.nums{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));height:24px;margin-top:7px}.nums div{display:flex;align-items:center;justify-content:center;color:#c4c8cb;font-size:8px;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.secondary{font-size:11px;padding:8px}.help{text-align:center;color:#858990;font-size:10px;margin-top:7px}@media(max-width:430px){.notes{gap:3px}.note-btn{font-size:12px;padding:8px 1px}.board{height:145px}.hit{width:29px;height:29px}.hit span{width:25px;height:25px}.posmark{top:72.5px}.posmark.two{height:145px}.posmark.two i:first-child{top:43.5px}.posmark.two i:last-child{top:101.5px}}
</style></head><body><div class="app"><h1>🎸 ギター指板 音名トレーニング</h1>
<div class="panel"><div class="notes" id="notes"></div><div class="mode-row"><button class="mode-btn" id="shuffle">シャッフル</button><button class="mode-btn" id="stringMode">弦指定</button><button class="mode-btn chaos-btn" id="chaos">カオス</button></div><div class="question" id="question">練習する音を選ぼう</div><div class="status" id="status">C〜Bから1音選択</div></div>
<div class="fretwrap"><div class="board" id="board"></div></div><div class="nums" id="nums"></div>
<div class="actions"><button class="secondary" id="undo">1つ戻る</button><button class="secondary" id="reset">やり直す</button></div></div>
<script>
const natural=[['C',0],['D',2],['E',4],['F',5],['G',7],['A',9],['B',11]];
const accidentals=[['C♯',1],['D♭',1],['D♯',3],['E♭',3],['F♯',6],['G♭',6],['G♯',8],['A♭',8],['A♯',10],['B♭',10]];
const tuning=[4,11,7,2,9,4]; // 上から1弦→6弦
let target=null,targetString=null,found=new Set(),locked=false,historyStack=[];
let mode='normal',shuffleQueue=[],shuffleIndex=0;
const notes=document.getElementById('notes'),board=document.getElementById('board'),question=document.getElementById('question'),status=document.getElementById('status');
const modeButtons=[document.getElementById('shuffle'),document.getElementById('stringMode'),document.getElementById('chaos')];
natural.forEach(([name,p])=>{const b=document.createElement('button');b.className='note-btn';b.textContent=name;b.onclick=()=>startNormal(name,p,b);notes.appendChild(b)});
for(let fret=0;fret<=12;fret++){const col=document.createElement('div');col.className='fretcol'+(fret===0?' open':'');col.dataset.fret=fret;if([3,5,7,9].includes(fret)){const m=document.createElement('div');m.className='posmark';m.innerHTML='<i></i>';col.appendChild(m)}if(fret===12){const m=document.createElement('div');m.className='posmark two';m.innerHTML='<i></i><i></i>';col.appendChild(m)}tuning.forEach((open,si)=>{const h=document.createElement('div');h.className='hit s'+(si+1);h.dataset.pitch=(open+fret)%12;h.dataset.string=si+1;h.dataset.key=si+'-'+fret;h.innerHTML='<span></span>';h.onclick=()=>tap(h);col.appendChild(h)});board.appendChild(col)}
const nums=document.getElementById('nums');nums.innerHTML=Array.from({length:13},(_,i)=>'<div>'+i+'F</div>').join('');
function clearBoard(){found.clear();historyStack=[];locked=false;document.querySelectorAll('.hit').forEach(h=>h.classList.remove('correct','wrong'));status.className='status'}
function clearUI(){document.querySelectorAll('.note-btn').forEach(x=>x.classList.remove('active'));modeButtons.forEach(x=>x.classList.remove('active'))}
function startNormal(name,p,btn){mode='normal';targetString=null;shuffleQueue=[];clearBoard();clearUI();target=p;btn.classList.add('active');question.innerHTML='<b>'+name+'</b> の位置をすべて探そう！';updateStatus()}
function totalTargets(){return [...document.querySelectorAll('.hit')].filter(h=>+h.dataset.pitch===target && (targetString===null || +h.dataset.string===targetString)).length}
function updateStatus(){if(target===null)return;if(mode==='shuffle')status.textContent=(shuffleIndex+1)+' / 7　見つけた数 '+found.size+' / '+totalTargets();else status.textContent='見つけた数 '+found.size+' / '+totalTargets()}
function tap(h){if(target===null||locked)return;const key=h.dataset.key;if(h.classList.contains('correct')||h.classList.contains('wrong'))return;const correct=+h.dataset.pitch===target && (targetString===null || +h.dataset.string===targetString);if(correct){h.classList.add('correct');found.add(key);historyStack.push({h,key,correct:true});updateStatus();if(found.size===totalTargets())completeQuestion()}else{h.classList.add('wrong');historyStack.push({h,key,correct:false})}}
function completeQuestion(){locked=true;if(mode==='shuffle' && shuffleIndex<6){status.textContent='正解！';setTimeout(()=>{shuffleIndex++;showShuffleQuestion()},450)}else if(mode==='shuffle'){status.textContent='COMPLETE！ 7音クリア！';status.className='status complete'}else if(mode==='string'||mode==='chaos'){status.textContent='正解！';status.className='status complete';setTimeout(()=>newStringQuestion(mode==='chaos'),500)}else{status.textContent='COMPLETE！ 全部見つけた！';status.className='status complete'}}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startShuffle(){mode='shuffle';targetString=null;clearUI();document.getElementById('shuffle').classList.add('active');shuffleQueue=shuffleArray([...natural]);shuffleIndex=0;showShuffleQuestion()}
function showShuffleQuestion(){clearBoard();const [name,p]=shuffleQueue[shuffleIndex];target=p;question.innerHTML='<b>'+name+'</b> の位置をすべて探そう！';updateStatus()}
function startStringMode(chaos=false){mode=chaos?'chaos':'string';clearUI();document.getElementById(chaos?'chaos':'stringMode').classList.add('active');newStringQuestion(chaos)}
function newStringQuestion(chaos=false){clearBoard();let pool=chaos?[...natural,...accidentals]:natural;let [name,p]=pool[Math.floor(Math.random()*pool.length)];target=p;targetString=Math.floor(Math.random()*6)+1;question.innerHTML='<b>'+targetString+'弦の '+name+'</b> を探そう！';updateStatus()}
document.getElementById('undo').onclick=()=>{const last=historyStack.pop();if(!last)return;last.h.classList.remove('correct','wrong');if(last.correct)found.delete(last.key);if(locked){locked=false;status.className='status'}updateStatus()};
document.getElementById('reset').onclick=()=>{if(mode==='shuffle'){showShuffleQuestion()}else if(mode==='string'||mode==='chaos'){clearBoard();updateStatus()}else if(target!==null){clearBoard();updateStatus()}};
document.getElementById('shuffle').onclick=startShuffle;
document.getElementById('stringMode').onclick=()=>startStringMode(false);
document.getElementById('chaos').onclick=()=>startStringMode(true);
</script></body></html>
