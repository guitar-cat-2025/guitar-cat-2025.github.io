 if(activeScale && rootPitch!==null){
   setHint(scaleNames[activeScale]+" / ルート："+(accidentalMode==="sharp"?sharpNames[rootPitch]:flatNames[rootPitch]));
 }else if(activeChord && rootPitch!==null){
   setHint((accidentalMode==="sharp"?sharpNames[rootPitch]:flatNames[rootPitch])+chordNames[activeChord]);
 }else if(displayMode!=="note" && rootPitch!==null){
   setHint("ルート："+(accidentalMode==="sharp"?sharpNames[rootPitch]:flatNames[rootPitch]));
 }
 render();
}



function cyclePresetMenu(){
 const menu=document.getElementById("scaleMenu");
 const scale=document.getElementById("scalePresets");
 const chord=document.getElementById("chordPresets");
 const btn=document.getElementById("scaleBtn");
 if(presetMenuState==="closed"){
   presetMenuState="chord";
   menu.classList.add("show");
   scale.style.display="none";
   chord.style.display="grid";
   btn.textContent="スケール";
   btn.classList.add("active");
 }else if(presetMenuState==="chord"){
   presetMenuState="scale";
   scale.style.display="grid";
   chord.style.display="none";
   btn.textContent="閉じる";
 }else{
   closePresetMenu();
 }
}
function closePresetMenu(){
 presetMenuState="closed";
 document.getElementById("scaleMenu").classList.remove("show");
 document.getElementById("scalePresets").style.display="none";
 document.getElementById("chordPresets").style.display="grid";
 document.getElementById("scaleBtn").textContent="コード";
 document.getElementById("scaleBtn").classList.remove("active");
}

function showPresetTab(tab){
 const scale=tab==="scale";
 document.getElementById("scalePresets").style.display=scale?"grid":"none";
 document.getElementById("chordPresets").style.display=scale?"none":"grid";
 document.getElementById("scaleTab").classList.toggle("active",scale);
 document.getElementById("chordTab").classList.toggle("active",!scale);
}

function chooseChord(type){
 pendingChord=type;
 pendingScale=null;
 waitingForRoot=true;
 displayMode="note";
 rootPitch=null;
 document.getElementById("degreeBtn").classList.remove("active");
 document.getElementById("degreeBtn").textContent="度数";
 closePresetMenu();
 setHint(chordNames[type]+"：ルート音を選んでください");
 render();
}

function applyChord(root,type){
 a.clear();
 chords[type].forEach(interval=>{
   const pitch=(root+interval)%12;
   a.set(pitch,interval===0?"red":"yellow");
 });
 activeChord=type;
 activeScale=null;
 rootPitch=root;
 displayMode="note";
 document.getElementById("degreeBtn").textContent="度数";
 setHint((accidentalMode==="sharp"?sharpNames[root]:flatNames[root])+chordNames[type]);
 render();
}

function toggleScaleMenu(){
 const menu=document.getElementById("scaleMenu");
 const opening=!menu.classList.contains("show");
 menu.classList.toggle("show",opening);
 document.getElementById("scaleBtn").classList.toggle("active",opening);
 if(!opening && pendingScale){
   pendingScale=null;
   waitingForRoot=false;
   setHint("");
 }
}

function chooseScale(type){
 pendingScale=type;
 pendingChord=null;
 activeChord=null;
 waitingForRoot=true;
 displayMode="note";
 rootPitch=null;
 document.getElementById("degreeBtn").classList.remove("active");
 document.getElementById("degreeBtn").textContent="度数";
 closePresetMenu();
 setHint(scaleNames[type]+"：ルート音を選んでください");

}

function applyScale(root,type){
 a.clear();
 scales[type].forEach(interval=>{
   const pitch=(root+interval)%12;
   a.set(pitch, interval===0 ? "red" : "yellow");
 });
 activeScale=type;
 activeChord=null;
 rootPitch=root;
 displayMode="note";
 document.getElementById("degreeBtn").textContent="度数";
 setHint(scaleNames[type]+" / ルート："+(accidentalMode==="sharp"?sharpNames[root]:flatNames[root]));
 render();
}

function toggleDegreeMode(){
 if(rootPitch===null){
   waitingForRoot=true;
   setHint("ルート音を選んでください");
   return;
 }
 if(displayMode==="note"){
   displayMode="degree";
   document.getElementById("degreeBtn").textContent="音程";
   document.getElementById("degreeBtn").classList.add("active");
 }else if(displayMode==="degree"){
   displayMode="interval";
   document.getElementById("degreeBtn").textContent="音名";
   document.getElementById("degreeBtn").classList.add("active");
 }else{
   displayMode="note";
   document.getElementById("degreeBtn").textContent="度数";
   document.getElementById("degreeBtn").classList.remove("active");
 }
 render();
}

function setHint(text){
 const h=document.getElementById("rootHint");
 h.textContent=text;
 h.classList.toggle("show",!!text);
}

function chooseNote(p){
 if(waitingForRoot && pendingChord){
   const type=pendingChord;
   pendingChord=null;
   waitingForRoot=false;
   applyChord(p,type);
   return;
 }
 if(waitingForRoot && pendingScale){
   const type=pendingScale;
   pendingScale=null;
   waitingForRoot=false;
   applyScale(p,type);
   return;
 }
 if(waitingForRoot){
   rootPitch=p;
   waitingForRoot=false;
   displayMode="degree";
   activeScale=null;
   document.getElementById("degreeBtn").textContent="音程";
   document.getElementById("degreeBtn").classList.add("active");
   setHint("ルート："+(accidentalMode==="sharp"?sharpNames[p]:flatNames[p]));
   render();
   return;
 }
 activeScale=null;
 activeChord=null;
 if(a.get(p)===color) a.delete(p);
 else a.set(p,color);
 render();
}

function clearAll(){
 a.clear();
 pendingScale=null;
 activeScale=null;
 pendingChord=null;
 activeChord=null;
 waitingForRoot=false;
 displayMode="note";
 rootPitch=null;
 document.getElementById("degreeBtn").classList.remove("active");
 document.getElementById("degreeBtn").textContent="度数";
 closePresetMenu();
 setHint("");
 render();
}

function render(){
 const noteNames=accidentalMode==="sharp"?sharpNames:flatNames;

 document.querySelectorAll(".note-btn").forEach((x,p)=>{
   let c=a.get(+x.dataset.pitch);
   x.classList.toggle("selected",!!c);
   x.style.background=c?cv[c]:"#292d34";
   x.style.color=c?"#111":"#fff";
   if(accidentalMode==="sharp"){
     x.textContent=buttonSharp[p];
   }else{
     x.textContent=noteNames[p];
   }
 });

 document.querySelectorAll(".string-hit").forEach(x=>{
   const p=+x.dataset.pitch;
   const c=a.get(p);
   x.classList.toggle("lit",!!c);
   if(c)x.dataset.color=c;else x.removeAttribute("data-color");
   const s=x.querySelector("span");
   if(displayMode==="degree" && rootPitch!==null){
     const degree=degrees[(p-rootPitch+12)%12];
     s.textContent=degree;
     s.classList.toggle("tritone", degree==="♯4/♭5");
   }else if(displayMode==="interval" && rootPitch!==null){
     const interval=intervals[(p-rootPitch+12)%12];
     s.textContent=interval;
     s.classList.toggle("tritone", interval==="A4/d5");
   }else{
     s.textContent=noteNames[p];
     s.classList.remove("tritone");
   }
 });
}
