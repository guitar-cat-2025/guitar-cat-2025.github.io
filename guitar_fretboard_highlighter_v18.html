<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ギター指板 音名ハイライト Ver.18</title>
<style>
*{box-sizing:border-box}:root{--bg:#101114;--panel:#1b1d22;--board:#20262c;--line:#aeb4ba;--muted:#969ba2}
body{margin:0;background:var(--bg);color:#f5f5f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:900px;margin:auto;padding:11px 7px 18px}h1{font-size:19px;text-align:center;margin:3px 0}.sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:9px}
.panel{background:var(--panel);padding:7px;border-radius:11px;margin-bottom:7px}.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;appearance:none;min-width:0;border:1px solid #474b53;background:#292d34;color:#fff;border-radius:8px;padding:7px 2px;font-size:11px;font-weight:750;white-space:nowrap}
.note-btn.selected{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.color-btn{display:flex;align-items:center;justify-content:center;gap:5px}.color-btn.active{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}
.color-btn i{width:12px;height:12px;border-radius:50%;border:1px solid #ddd}.y{background:#ffd84d}.r{background:#ff5c5c}.b{background:#55a8ff}.g{background:#58d47b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.actions.three{grid-template-columns:repeat(3,1fr)}.root-hint{text-align:center;height:0;overflow:hidden;color:#ffd84d;font-size:10px;font-weight:700;transition:.15s}.root-hint.show{height:18px;padding-top:5px}#degreeBtn.active{background:#eee;color:#111}.help{text-align:center;color:#858990;font-size:10px;margin:5px 0 8px}

.fretwrap{display:grid;grid-template-columns:25px 1fr;width:100%}
.labels{height:125px;position:relative;background:#15191d}
.slab{position:absolute;left:0;width:25px;height:18px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#e1e3e5}
.slab small{font-size:6px;color:#8f969d}
.slab.s1{top:0%}.slab.s2{top:20%}.slab.s3{top:40%}.slab.s4{top:60%}.slab.s5{top:80%}.slab.s6{top:100%}

.board{height:125px;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));border-top:1px solid #596068;border-bottom:1px solid #596068;box-sizing:border-box}
.fretcol{position:relative;background:linear-gradient(#252c32,#1c2227);border-right:2px solid #8e959b}
.fretcol.open{background:#171b1f;border-right:4px solid #dce0e3}
.fretcol:before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:
linear-gradient(to bottom,
#aeb4ba 0,#aeb4ba 1px,transparent 1px,transparent calc(20% - .7px),
#aeb4ba calc(20% - .7px),#aeb4ba calc(20% + .7px),transparent calc(20% + .7px),transparent calc(40% - .7px),
#aeb4ba calc(40% - .7px),#aeb4ba calc(40% + .7px),transparent calc(40% + .7px),transparent calc(60% - .7px),
#aeb4ba calc(60% - .7px),#aeb4ba calc(60% + .7px),transparent calc(60% + .7px),transparent calc(80% - .7px),
#aeb4ba calc(80% - .7px),#aeb4ba calc(80% + .7px),transparent calc(80% + .7px),transparent calc(100% - 1px),
#aeb4ba calc(100% - 1px),#aeb4ba 100%)}
.fretcol:after{display:none}

.string-hit{position:absolute;left:50%;width:23px;height:23px;transform:translate3d(-50%,-50%,0);z-index:4;display:flex;align-items:center;justify-content:center}
.string-hit.s1{top:0}.string-hit.s2{top:20%}.string-hit.s3{top:40%}.string-hit.s4{top:60%}.string-hit.s5{top:80%}.string-hit.s6{top:100%}
.string-hit span{display:none;width:21px;height:21px;border-radius:50%;align-items:center;justify-content:center;color:#101114;font-size:7px;font-weight:900;border:1px solid rgba(255,255,255,.65);box-shadow:0 1px 5px #000}
.string-hit.lit span{display:flex}.string-hit span.tritone{font-size:5.5px;letter-spacing:-.3px}.string-hit[data-color=yellow] span{background:#ffd84d}.string-hit[data-color=red] span{background:#ff5c5c}.string-hit[data-color=blue] span{background:#55a8ff}.string-hit[data-color=green] span{background:#58d47b}
.posmark{position:absolute;left:50%;top:62.5px;transform:translate(-50%,-50%);z-index:1;display:flex;align-items:center;justify-content:center;gap:3px;width:100%;pointer-events:none}
.posmark i{width:8px;height:8px;border-radius:50%;background:#777e84;display:block;opacity:.75}
.posmark.two{top:0;left:0;transform:none;width:100%;height:125px;display:block}
.posmark.two i{position:absolute;width:8px;height:8px;left:50%;transform:translate(-50%,-50%)}
.posmark.two i:first-child{top:37.5px}
.posmark.two i:last-child{top:87.5px}

.nums{display:grid;grid-template-columns:25px repeat(13,minmax(0,1fr));height:24px;margin-top:7px}.nums div{display:flex;align-items:center;justify-content:center;color:#c4c8cb;font-size:8px;font-weight:700}
.range-switch{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-size:11px!important;color:#cfd3d7!important}.fret-switch{gap:1px;user-select:none;-webkit-user-select:none}
.fret-switch span{font-size:8px;color:#9fa5aa;line-height:1}
.fret-switch b{font-size:8px;color:#c4c8cb}
@media(min-width:600px){.notes{grid-template-columns:repeat(6,1fr)}}
</style></head><body><div class="app">
<h1>🎸 ギター指板 音名ハイライト</h1>
<div class="panel"><div class="notes"><button class="note-btn" data-pitch="0" onclick="chooseNote(0)">C</button><button class="note-btn" data-pitch="1" onclick="chooseNote(1)">C♯/D♭</button><button class="note-btn" data-pitch="2" onclick="chooseNote(2)">D</button><button class="note-btn" data-pitch="3" onclick="chooseNote(3)">D♯/E♭</button><button class="note-btn" data-pitch="4" onclick="chooseNote(4)">E</button><button class="note-btn" data-pitch="5" onclick="chooseNote(5)">F</button><button class="note-btn" data-pitch="6" onclick="chooseNote(6)">F♯/G♭</button><button class="note-btn" data-pitch="7" onclick="chooseNote(7)">G</button><button class="note-btn" data-pitch="8" onclick="chooseNote(8)">G♯/A♭</button><button class="note-btn" data-pitch="9" onclick="chooseNote(9)">A</button><button class="note-btn" data-pitch="10" onclick="chooseNote(10)">A♯/B♭</button><button class="note-btn" data-pitch="11" onclick="chooseNote(11)">B</button></div></div>
<div class="panel"><div class="colors">
<button class="color-btn active" data-color="yellow" onclick="setColor('yellow',this)"><i class="y"></i>黄</button>
<button class="color-btn" data-color="red" onclick="setColor('red',this)"><i class="r"></i>赤</button>
<button class="color-btn" data-color="blue" onclick="setColor('blue',this)"><i class="b"></i>青</button>
<button class="color-btn" data-color="green" onclick="setColor('green',this)"><i class="g"></i>緑</button>
</div>
<div class="actions three">
<button id="accBtn" onclick="toggleAccidental()">♯ 表示</button>
<button id="degreeBtn" onclick="toggleDegreeMode()">度数</button>
<button onclick="clearAll()">全解除</button>
</div>
<div id="rootHint" class="root-hint"></div>
</div>

<div class="fretwrap"><div class="labels"><div class="slab s1"><b>1</b><small>E</small></div><div class="slab s2"><b>2</b><small>B</small></div><div class="slab s3"><b>3</b><small>G</small></div><div class="slab s4"><b>4</b><small>D</small></div><div class="slab s5"><b>5</b><small>A</small></div><div class="slab s6"><b>6</b><small>E</small></div></div><div class="board"><div class="fretcol open"><div class="string-hit s1" data-pitch="4"><span>E</span></div><div class="string-hit s2" data-pitch="11"><span>B</span></div><div class="string-hit s3" data-pitch="7"><span>G</span></div><div class="string-hit s4" data-pitch="2"><span>D</span></div><div class="string-hit s5" data-pitch="9"><span>A</span></div><div class="string-hit s6" data-pitch="4"><span>E</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="5"><span>F</span></div><div class="string-hit s2" data-pitch="0"><span>C</span></div><div class="string-hit s3" data-pitch="8"><span>G♯</span></div><div class="string-hit s4" data-pitch="3"><span>D♯</span></div><div class="string-hit s5" data-pitch="10"><span>A♯</span></div><div class="string-hit s6" data-pitch="5"><span>F</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="6"><span>F♯</span></div><div class="string-hit s2" data-pitch="1"><span>C♯</span></div><div class="string-hit s3" data-pitch="9"><span>A</span></div><div class="string-hit s4" data-pitch="4"><span>E</span></div><div class="string-hit s5" data-pitch="11"><span>B</span></div><div class="string-hit s6" data-pitch="6"><span>F♯</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="7"><span>G</span></div><div class="string-hit s2" data-pitch="2"><span>D</span></div><div class="string-hit s3" data-pitch="10"><span>A♯</span></div><div class="string-hit s4" data-pitch="5"><span>F</span></div><div class="string-hit s5" data-pitch="0"><span>C</span></div><div class="string-hit s6" data-pitch="7"><span>G</span></div><div class="posmark one"><i></i></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="8"><span>G♯</span></div><div class="string-hit s2" data-pitch="3"><span>D♯</span></div><div class="string-hit s3" data-pitch="11"><span>B</span></div><div class="string-hit s4" data-pitch="6"><span>F♯</span></div><div class="string-hit s5" data-pitch="1"><span>C♯</span></div><div class="string-hit s6" data-pitch="8"><span>G♯</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="9"><span>A</span></div><div class="string-hit s2" data-pitch="4"><span>E</span></div><div class="string-hit s3" data-pitch="0"><span>C</span></div><div class="string-hit s4" data-pitch="7"><span>G</span></div><div class="string-hit s5" data-pitch="2"><span>D</span></div><div class="string-hit s6" data-pitch="9"><span>A</span></div><div class="posmark one"><i></i></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="10"><span>A♯</span></div><div class="string-hit s2" data-pitch="5"><span>F</span></div><div class="string-hit s3" data-pitch="1"><span>C♯</span></div><div class="string-hit s4" data-pitch="8"><span>G♯</span></div><div class="string-hit s5" data-pitch="3"><span>D♯</span></div><div class="string-hit s6" data-pitch="10"><span>A♯</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="11"><span>B</span></div><div class="string-hit s2" data-pitch="6"><span>F♯</span></div><div class="string-hit s3" data-pitch="2"><span>D</span></div><div class="string-hit s4" data-pitch="9"><span>A</span></div><div class="string-hit s5" data-pitch="4"><span>E</span></div><div class="string-hit s6" data-pitch="11"><span>B</span></div><div class="posmark one"><i></i></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="0"><span>C</span></div><div class="string-hit s2" data-pitch="7"><span>G</span></div><div class="string-hit s3" data-pitch="3"><span>D♯</span></div><div class="string-hit s4" data-pitch="10"><span>A♯</span></div><div class="string-hit s5" data-pitch="5"><span>F</span></div><div class="string-hit s6" data-pitch="0"><span>C</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="1"><span>C♯</span></div><div class="string-hit s2" data-pitch="8"><span>G♯</span></div><div class="string-hit s3" data-pitch="4"><span>E</span></div><div class="string-hit s4" data-pitch="11"><span>B</span></div><div class="string-hit s5" data-pitch="6"><span>F♯</span></div><div class="string-hit s6" data-pitch="1"><span>C♯</span></div><div class="posmark one"><i></i></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="2"><span>D</span></div><div class="string-hit s2" data-pitch="9"><span>A</span></div><div class="string-hit s3" data-pitch="5"><span>F</span></div><div class="string-hit s4" data-pitch="0"><span>C</span></div><div class="string-hit s5" data-pitch="7"><span>G</span></div><div class="string-hit s6" data-pitch="2"><span>D</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="3"><span>D♯</span></div><div class="string-hit s2" data-pitch="10"><span>A♯</span></div><div class="string-hit s3" data-pitch="6"><span>F♯</span></div><div class="string-hit s4" data-pitch="1"><span>C♯</span></div><div class="string-hit s5" data-pitch="8"><span>G♯</span></div><div class="string-hit s6" data-pitch="3"><span>D♯</span></div></div><div class="fretcol "><div class="string-hit s1" data-pitch="4"><span>E</span></div><div class="string-hit s2" data-pitch="11"><span>B</span></div><div class="string-hit s3" data-pitch="7"><span>G</span></div><div class="string-hit s4" data-pitch="2"><span>D</span></div><div class="string-hit s5" data-pitch="9"><span>A</span></div><div class="string-hit s6" data-pitch="4"><span>E</span></div><div class="posmark two"><i></i><i></i></div></div></div></div>
<div class="nums"><div></div><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div></div>
</div>
<script>
const a=new Map();
let color="yellow", fretStart=0;
let accidentalMode="sharp";
let degreeMode=false;
let waitingForRoot=false;
let rootPitch=null;

const cv={yellow:"#ffd84d",red:"#ff5c5c",blue:"#55a8ff",green:"#58d47b"};
const sharpNames=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const flatNames =["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const buttonSharp=["C","C♯/D♭","D","D♯/E♭","E","F","F♯/G♭","G","G♯/A♭","A","A♯/B♭","B"];
const degrees=["P1","m2","M2","m3","M3","P4","A4/d5","P5","m6","M6","m7","M7"];

function toggleFretRange(){
 fretStart=fretStart===0?12:0;
 document.getElementById("firstFretNum").textContent=fretStart;
 document.querySelectorAll(".fret-num").forEach(x=>x.textContent=fretStart+Number(x.dataset.offset));
}

function setColor(c,b){
 color=c;
 document.querySelectorAll(".color-btn").forEach(x=>x.classList.toggle("active",x===b));
}

function toggleAccidental(){
 accidentalMode=accidentalMode==="sharp"?"flat":"sharp";
 document.getElementById("accBtn").textContent=accidentalMode==="sharp"?"♯ 表示":"♭ 表示";
 render();
}

function toggleDegreeMode(){
 if(degreeMode){
   degreeMode=false;
   waitingForRoot=false;
   rootPitch=null;
   document.getElementById("degreeBtn").classList.remove("active");
   setHint("");
 }else{
   waitingForRoot=true;
   document.getElementById("degreeBtn").classList.add("active");
   setHint("ルート音を選んでください");
 }
 render();
}

function setHint(text){
 const h=document.getElementById("rootHint");
 h.textContent=text;
 h.classList.toggle("show",!!text);
}

function chooseNote(p){
 if(waitingForRoot){
   rootPitch=p;
   waitingForRoot=false;
   degreeMode=true;
   setHint("ルート："+(accidentalMode==="sharp"?sharpNames[p]:flatNames[p]));
   render();
   return;
 }
 if(a.get(p)===color) a.delete(p);
 else a.set(p,color);
 render();
}

function clearAll(){
 a.clear();
 render();
}

function render(){
 const noteNames=accidentalMode==="sharp"?sharpNames:flatNames;

 document.querySelectorAll(".note-btn").forEach((x,p)=>{
   let c=a.get(+x.dataset.pitch);
   x.classList.toggle("selected",!!c);
   x.style.background=c?cv[c]:"#292d34";
   x.style.color=c?"#111":"#fff";
   if(accidentalMode==="sharp"){
     x.textContent=buttonSharp[p];
   }else{
     x.textContent=noteNames[p];
   }
 });

 document.querySelectorAll(".string-hit").forEach(x=>{
   const p=+x.dataset.pitch;
   const c=a.get(p);
   x.classList.toggle("lit",!!c);
   if(c)x.dataset.color=c;else x.removeAttribute("data-color");
   const s=x.querySelector("span");
   if(degreeMode && rootPitch!==null){
     const interval=degrees[(p-rootPitch+12)%12];
     s.textContent=interval;
     s.classList.toggle("tritone", interval==="A4/d5");
   }else{
     s.textContent=noteNames[p];
     s.classList.remove("tritone");
   }
 });
}
</script></body></html>
