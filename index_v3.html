<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>音名トレーニング</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:720px;margin:auto;padding:18px 14px 30px;text-align:center}h1{font-size:24px;margin:5px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{background:#1d1d1d;border-radius:12px;padding:8px 4px;color:#aaa;font-size:12px}.stat b{display:block;color:#fff;font-size:20px;margin-top:2px}.card{background:#1b1b1b;border-radius:20px;padding:22px 12px 18px}.note{font-size:72px;font-weight:800;line-height:1.05;margin:8px 0 16px}.message{height:25px;font-weight:700;font-size:17px;margin-bottom:9px}.ok{color:#55e58a}.ng{color:#ff6d6d}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{border:0;border-radius:12px;background:#303030;color:#fff;font-size:18px;font-weight:700;padding:15px 3px;cursor:pointer}button:active{transform:scale(.97)}.modeTitle{margin:18px 0 8px;text-align:left;font-size:14px;color:#aaa}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mode{background:#242424;border:2px solid transparent;font-size:16px;padding:12px 5px}.mode.active{border-color:#fff;background:#333}.actions{margin-top:10px}.actions button{width:100%;font-size:14px;padding:11px;background:#222}.info{font-size:12px;color:#777;line-height:1.5;margin-top:14px}@media(max-width:390px){.note{font-size:62px}.answers{grid-template-columns:repeat(3,1fr)}}</style></head>
<body><div class="app"><h1>🎸 音名トレーニング</h1>
<div class="stats"><div class="stat">問題<b id="total">0</b></div><div class="stat">正解率<b id="accuracy">--%</b></div><div class="stat">連続正解<b id="streak">0</b></div></div>
<div class="card"><div class="note" id="note">C</div><div class="message" id="message"></div><div class="answers" id="answers"></div></div>
<div class="modeTitle">出題モード</div><div class="modes"><button class="mode active" data-mode="natural">ナチュラル</button><button class="mode" data-mode="sharp">♯</button><button class="mode" data-mode="flat">♭</button><button class="mode" data-mode="both">♯＋♭ ランダム</button></div>
<div class="actions"><button id="reset">成績をリセット</button></div>
<div class="info">ナチュラル：C D E F G A B<br>♯：ナチュラル＋ C♯ D♯ F♯ G♯ A♯<br>♭：ナチュラル＋ D♭ E♭ G♭ A♭ B♭<br>♯＋♭：上記をすべてランダム出題</div></div>
<script>
const natural=[["C","ド",0],["D","レ",2],["E","ミ",4],["F","ファ",5],["G","ソ",7],["A","ラ",9],["B","シ",11]].map(x=>({en:x[0],jp:x[1],pc:x[2]}));
const sharp=[["C♯","ド♯",1],["D♯","レ♯",3],["F♯","ファ♯",6],["G♯","ソ♯",8],["A♯","ラ♯",10]].map(x=>({en:x[0],jp:x[1],pc:x[2]}));
const flat=[["D♭","レ♭",1],["E♭","ミ♭",3],["G♭","ソ♭",6],["A♭","ラ♭",8],["B♭","シ♭",10]].map(x=>({en:x[0],jp:x[1],pc:x[2]}));
let mode="natural",current=null,total=0,correct=0,streak=0,locked=false;
const note=document.getElementById("note"),answers=document.getElementById("answers"),message=document.getElementById("message");
function pool(){return mode==="natural"?natural:mode==="sharp"?natural.concat(sharp):mode==="flat"?natural.concat(flat):natural.concat(sharp,flat)}
function build(){answers.innerHTML="";pool().forEach(n=>{const b=document.createElement("button");b.textContent=n.jp;b.onclick=()=>answer(n.jp);answers.appendChild(b)})}
function adjacent(a,b){if(!a||!b)return false;const d=Math.abs(a.pc-b.pc);return d===1||d===11}
function next(){const list=pool();let candidates=list.filter(n=>!current|| (n.en!==current.en&&!adjacent(n,current)));if(!candidates.length)candidates=list.filter(n=>!current||n.en!==current.en);current=candidates[Math.floor(Math.random()*candidates.length)];note.textContent=current.en;message.textContent="";message.className="message";locked=false}
function answer(v){if(locked)return;locked=true;total++;if(v===current.jp){correct++;streak++;message.textContent="⭕ 正解！";message.className="message ok"}else{streak=0;message.textContent="❌ 正解は「"+current.jp+"」";message.className="message ng"}update();setTimeout(next,650)}
function update(){document.getElementById("total").textContent=total;document.getElementById("accuracy").textContent=total?Math.round(correct/total*100)+"%":"--%";document.getElementById("streak").textContent=streak}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;current=null;build();next()});
document.getElementById("reset").onclick=()=>{total=correct=streak=0;current=null;update();next()};build();next();
</script></body></html>
