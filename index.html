<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>音名トレーニング CDEFGAB</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#111;color:#fff;min-height:100vh;display:flex;justify-content:center}
.app{width:min(720px,100%);padding:24px 16px 36px;text-align:center}
h1{font-size:24px;margin:4px 0 8px}
.sub{color:#aaa;font-size:14px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:#1d1d1d;border-radius:12px;padding:10px}
.stat b{display:block;font-size:21px;margin-top:3px}
.card{background:#1b1b1b;border-radius:20px;padding:28px 16px 22px}
.note{font-size:76px;font-weight:800;line-height:1;margin:8px 0 24px;letter-spacing:2px}
.message{height:28px;font-size:18px;font-weight:700;margin-bottom:14px}
.message.ok{color:#5ee88a}.message.ng{color:#ff7373}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:14px;background:#303030;color:#fff;font-size:21px;font-weight:700;padding:17px 6px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.55}
.controls{display:flex;gap:10px;margin-top:14px}
.controls button{flex:1;font-size:15px;padding:12px;background:#252525}
.help{color:#888;font-size:12px;margin-top:16px;line-height:1.6}
@media(max-width:420px){.note{font-size:64px}.buttons{grid-template-columns:repeat(3,1fr)}button{padding:16px 4px}}
</style>
</head>
<body>
<div class="app">
  <h1>音名トレーニング</h1>
  <div class="sub">C D E F G A B → ド レ ミ ファ ソ ラ シ</div>

  <div class="stats">
    <div class="stat">問題<b id="total">0</b></div>
    <div class="stat">正解率<b id="accuracy">--%</b></div>
    <div class="stat">連続正解<b id="streak">0</b></div>
  </div>

  <div class="card">
    <div class="note" id="note">C</div>
    <div class="message" id="message"></div>
    <div class="buttons" id="buttons"></div>
  </div>

  <div class="controls">
    <button id="reset">成績をリセット</button>
    <button id="toggleReverse">逆問題：OFF</button>
  </div>

  <div class="help">
    まずは英語音名を見て、対応するドレミを瞬間的にクリック。<br>
    「逆問題」をONにすると、ドレミ → CDEFGABにも挑戦できます。
  </div>
</div>

<script>
const notes = [
  {en:"C",jp:"ド"}, {en:"D",jp:"レ"}, {en:"E",jp:"ミ"},
  {en:"F",jp:"ファ"}, {en:"G",jp:"ソ"}, {en:"A",jp:"ラ"}, {en:"B",jp:"シ"}
];

let current;
let total=0, correct=0, streak=0;
let reverse=false;
let locked=false;

const noteEl=document.getElementById("note");
const messageEl=document.getElementById("message");
const totalEl=document.getElementById("total");
const accuracyEl=document.getElementById("accuracy");
const streakEl=document.getElementById("streak");
const buttonsEl=document.getElementById("buttons");
const reverseBtn=document.getElementById("toggleReverse");

function buildButtons(){
  buttonsEl.innerHTML="";
  notes.forEach(n=>{
    const b=document.createElement("button");
    b.textContent=reverse?n.en:n.jp;
    b.dataset.value=reverse?n.en:n.jp;
    b.addEventListener("click",()=>answer(b.dataset.value));
    buttonsEl.appendChild(b);
  });
}

function newQuestion(){
  current=notes[Math.floor(Math.random()*notes.length)];
  noteEl.textContent=reverse?current.jp:current.en;
  messageEl.textContent="";
  messageEl.className="message";
  locked=false;
}

function answer(value){
  if(locked)return;
  locked=true;
  total++;

  const expected=reverse?current.en:current.jp;
  if(value===expected){
    correct++;
    streak++;
    messageEl.textContent="正解！";
    messageEl.className="message ok";
  }else{
    streak=0;
    messageEl.textContent=`不正解　正解は「${expected}」`;
    messageEl.className="message ng";
  }
  updateStats();
  setTimeout(newQuestion,650);
}

function updateStats(){
  totalEl.textContent=total;
  accuracyEl.textContent=total?Math.round(correct/total*100)+"%":"--%";
  streakEl.textContent=streak;
}

document.getElementById("reset").addEventListener("click",()=>{
  total=0;correct=0;streak=0;updateStats();newQuestion();
});

reverseBtn.addEventListener("click",()=>{
  reverse=!reverse;
  reverseBtn.textContent=`逆問題：${reverse?"ON":"OFF"}`;
  buildButtons();
  newQuestion();
});

buildButtons();
newQuestion();
</script>
</body>
</html>
