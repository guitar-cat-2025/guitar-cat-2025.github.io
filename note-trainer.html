<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>NOTE TRAINER｜音名変換トレーニング</title>
<style>
:root{--bg:#0b0b0d;--panel:#151518;--soft:#202024;--line:#2b2b31;--text:#f5f5f7;--muted:#8e8e93}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans JP",sans-serif;min-height:100vh}
.app{width:min(620px,100%);margin:auto;padding:34px 18px 42px;text-align:center}
.brand{font-size:12px;letter-spacing:.22em;color:var(--muted);font-weight:700}
h1{font-size:22px;margin:7px 0 28px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:30px 16px 22px;box-shadow:0 14px 40px rgba(0,0,0,.22)}
.single{font-size:82px;font-weight:750;line-height:1;margin:12px 0 30px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:center}
.questions{margin:10px 0 8px}
.q{font-size:36px;font-weight:750;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1}
.progress{margin:0 0 22px}
.p{font-size:18px;font-weight:650;color:#555;height:32px;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1}
.p.done{color:var(--text)}
.message{height:25px;margin:3px 0 13px;font-size:16px;font-weight:700}
.ok{color:#72e39a}.ng{color:#ff7b7b}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.answer{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:15px;padding:16px 4px;font-size:19px;font-weight:700;touch-action:manipulation}
.answer:active{transform:scale(.96);background:#2a2a30}
.stats{display:flex;justify-content:center;gap:28px;margin:22px 0 23px;color:var(--muted);font-size:12px}
.stats b{display:block;color:var(--text);font-size:17px;margin-bottom:3px}
.divider{height:1px;background:var(--line);margin:0 8px 22px}
.controls{display:flex;align-items:center;justify-content:center;gap:14px}
.segment{display:flex;background:#151518;border:1px solid var(--line);padding:4px;border-radius:14px}
.seg{border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:10px;font-size:12px;letter-spacing:.05em;font-weight:750}
.seg.active{background:#2a2a30;color:#fff}
.swap{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#151518;color:#fff;font-size:21px;font-weight:700}
.direction{font-size:11px;color:#666;margin-top:10px;letter-spacing:.08em}
.reset{margin-top:22px;border:0;background:none;color:#666;font-size:12px;padding:8px}
@media(max-width:390px){.app{padding-left:13px;padding-right:13px}.single{font-size:72px}.q{font-size:30px}.answers{grid-template-columns:repeat(3,1fr)}.stats{gap:20px}}

/* v10: stable 5-note result layout */
.message{
  height:auto !important;
  min-height:25px !important;
  overflow:visible !important;
}
.compare{
  width:100%;
  margin:4px 0 12px;
}
.compareTitle{
  font-size:9px;
  line-height:12px;
  color:#777;
  letter-spacing:.08em;
  margin:5px 0 2px;
}
.compareRow{
  display:grid !important;
  grid-template-columns:repeat(5,minmax(0,1fr)) !important;
  gap:5px !important;
  width:100% !important;
  margin:0 !important;
}
.compareCell{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  width:auto !important;
  min-width:0 !important;
  height:26px !important;
  padding:0 !important;
  font-size:15px !important;
  line-height:1 !important;
  font-weight:750 !important;
  white-space:nowrap !important;
  writing-mode:horizontal-tb !important;
}
.compareCell.good{color:#72e39a !important}
.compareCell.bad{color:#ff7b7b !important}


.back{display:block;width:max-content;margin:0 0 18px;text-decoration:none;color:#8e8e93;font-size:12px;font-weight:700;padding:8px 10px;border:1px solid #2b2b31;border-radius:11px;background:#151518}
.back:active{background:#202024}

/* Stable feedback overlay: result display never changes layout */
.card{position:relative}
.card.fiveMode{padding-bottom:22px}
.card.fiveMode .message{
  position:absolute !important;
  left:12px !important;
  right:12px !important;
  bottom:20px !important;
  height:68px !important;
  min-height:68px !important;
  margin:0 !important;
  z-index:3;
  pointer-events:none;
  display:block !important;
}
.card.fiveMode .answers{
  margin-top:78px !important;
}
.card.fiveMode .compare{margin:0 !important;width:100%}


/* vNext: fixed feedback slot in normal flow */
.card.fiveMode .message{
  position:static !important;
  left:auto !important;
  right:auto !important;
  bottom:auto !important;
  width:100% !important;
  height:68px !important;
  min-height:68px !important;
  margin:8px 0 10px !important;
  display:block !important;
  overflow:hidden !important;
  pointer-events:auto !important;
}
.card.fiveMode .answers{
  margin-top:0 !important;
}
.card.fiveMode .compare{
  width:100% !important;
  margin:0 !important;
}

</style>
</head>
<body>
<main class="app">

<h1>音名変換トレーニング</h1>

<section class="card" id="trainerCard">
  <div id="question"></div>
  <div id="message" class="message"></div>
  <div id="answers" class="answers"></div>
</section>

<div class="stats">
  <div><b id="total">0</b>QUESTIONS</div>
  <div><b id="accuracy">--%</b>ACCURACY</div>
  <div><b id="streak">0</b>STREAK</div>
</div>

<div class="divider"></div>

<div class="controls">
  <div class="segment">
    <button class="seg active" data-count="1">1 NOTE</button>
    <button class="seg" data-count="5">5 NOTES</button>
  </div>
  <button class="swap" id="swap" aria-label="出題と回答を入れ替える">⇄</button>
</div>

<button class="reset" id="reset">RESET SCORE</button>
</main>

<script>
const notes=[
 {en:"C",jp:"ド",i:0},{en:"D",jp:"レ",i:1},{en:"E",jp:"ミ",i:2},
 {en:"F",jp:"ファ",i:3},{en:"G",jp:"ソ",i:4},{en:"A",jp:"ラ",i:5},{en:"B",jp:"シ",i:6}
];

let count=1, direction="en-jp", current=[], entered=[];
let total=0, correct=0, streak=0, locked=false, previousSingle=null, previousGroup="", groupMistakes=[];

const q=document.getElementById("question");
const a=document.getElementById("answers");
const m=document.getElementById("message");


function source(n){return direction==="en-jp"?n.en:n.jp}
function target(n){return direction==="en-jp"?n.jp:n.en}

function makeQuestion(){
 if(count===1){
   const choices=notes.filter(n=>!previousSingle || n.en!==previousSingle.en);
   const picked=choices[Math.floor(Math.random()*choices.length)];
   previousSingle=picked;
   return [picked];
 }
 let result=[], used=new Set(), attempts=0;
 do{
   result=[]; used.clear();
   while(result.length<5){
     let candidates=notes.filter(n=>!used.has(n.en));
     if(result.length){
       const prev=result[result.length-1];
       const safe=candidates.filter(n=>Math.abs(n.i-prev.i)>1);
       if(safe.length)candidates=safe;
     }
     const picked=candidates[Math.floor(Math.random()*candidates.length)];
     result.push(picked); used.add(picked.en);
   }
   attempts++;
 }while(result.map(n=>n.en).join("")===previousGroup && attempts<20);
 previousGroup=result.map(n=>n.en).join("");
 return result;
}

function renderQuestion(){
 document.getElementById("trainerCard").classList.toggle("fiveMode",count===5);
 q.innerHTML="";
 if(count===1){
   const el=document.createElement("div");
   el.className="single";
   el.textContent=source(current[0]);
   q.appendChild(el);
 }else{
   const top=document.createElement("div"); top.className="row questions";
   current.forEach(n=>{const el=document.createElement("div");el.className="q";el.textContent=source(n);top.appendChild(el)});
   const bottom=document.createElement("div"); bottom.className="row progress";
   for(let i=0;i<5;i++){
     const el=document.createElement("div");
     el.className="p"+(i<entered.length?" done":"");
     el.textContent=i<entered.length?entered[i]:"＿";
     bottom.appendChild(el);
   }
   q.append(top,bottom);
 }
}

function renderAnswers(){
 a.innerHTML="";
 notes.map(target).forEach(value=>{
   const b=document.createElement("button");
   b.className="answer"; b.textContent=value;
   b.onclick=()=>answer(value);
   a.appendChild(b);
 });
}

function next(){
 current=makeQuestion(); entered=[]; groupMistakes=[]; locked=false;
 m.innerHTML=""; m.className="message";
 renderQuestion();
}

function answer(value){
 if(locked)return;
 const index=count===1?0:entered.length;
 const expected=target(current[index]);

 if(count===1){
   locked=true; total++;
   if(value===expected){correct++;streak++;m.textContent="✓ CORRECT";m.className="message ok"}
   else{streak=0;m.textContent="正解： "+expected;m.className="message ng"}
   updateStats(); setTimeout(next,620); return;
 }

 // 5 NOTES: accept all five inputs even if one or more are wrong.
 entered.push(value);
 groupMistakes.push(value!==expected);
 renderQuestion();

 if(entered.length===5){
   locked=true; total++;

   const allCorrect=!groupMistakes.some(Boolean);

   if(allCorrect){
     correct++; streak++;
     m.textContent="✓ ALL CORRECT";
     m.className="message ok";
   }else{
     streak=0;
     m.className="message";
     m.innerHTML="";
     const box=document.createElement("div"); box.className="compare";
     const t2=document.createElement("div"); t2.className="compareTitle"; t2.textContent="CORRECT";
     const r2=document.createElement("div"); r2.className="compareRow";
     current.map(target).forEach((v,i)=>{const c=document.createElement("div");c.className="compareCell "+(groupMistakes[i]?"bad":"good");c.textContent=v;r2.appendChild(c)});
     box.append(t2,r2); m.appendChild(box);
   }

   updateStats();
   setTimeout(next, allCorrect?720:2600);
 }
}

function updateStats(){
 document.getElementById("total").textContent=total;
 document.getElementById("accuracy").textContent=total?Math.round(correct/total*100)+"%":"--%";
 document.getElementById("streak").textContent=streak;
}

document.querySelectorAll(".seg").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".seg").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 count=Number(btn.dataset.count);
 previousSingle=null;previousGroup="";next();
});

document.getElementById("swap").onclick=()=>{
 direction=direction==="en-jp"?"jp-en":"en-jp";
 previousSingle=null;previousGroup="";
 renderAnswers();next();
};

document.getElementById("reset").onclick=()=>{
 total=correct=streak=0;previousSingle=null;previousGroup="";
 updateStats();next();
};

renderAnswers();next();
</script>
</body>
</html>
